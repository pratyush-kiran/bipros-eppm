services:
  postgresql:
    # Custom image: postgis/postgis:17-3.5 (Postgres 17 + PostGIS 3.5 for the
    # gis module's wbs_polygons geometry column) extended with pgvector for the
    # HDS knowledge base. See docker/postgres/Dockerfile.
    build:
      context: ./docker/postgres
    image: bipros-postgis-pgvector:17-3.5
    container_name: bipros-postgres
    environment:
      # Credentials chosen to match what the Khasab import scripts expect
      # (so they can target this container by adding `-p 5433` without any
      # other env-var override).
      POSTGRES_PASSWORD: bipros_dev
      POSTGRES_DB: bipros
      POSTGRES_USER: bipros
      POSTGRES_INITDB_ARGS: ""
    ports:
      # Host port 5433 → container port 5432 so this can coexist with native
      # Postgres.app on 5432. Backend connects via DATABASE_URL on 5433.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-schemas.sql:/docker-entrypoint-initdb.d/01-init-schemas.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bipros-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bipros.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgresql:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: bipros-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  docling:
    image: quay.io/docling-project/docling-serve-cpu:latest
    container_name: bipros-docling
    ports:
      - "5001:5001"
    environment:
      DOCLING_SERVE_ENABLE_UI: "false"
      DOCLING_SERVE_API_HOST: "0.0.0.0"
    deploy:
      resources:
        limits:
          memory: 12G
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5001/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # S3-compatible object store for satellite raster tiles. Prod can point the
  # storage adapter at AWS S3; dev uses MinIO so `docker compose up -d` gives a
  # working pipeline without AWS credentials.
  minio:
    image: minio/minio:latest
    container_name: bipros-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  clickhouse:
    image: clickhouse/clickhouse-server:24.12-alpine
    container_name: bipros-clickhouse
    environment:
      CLICKHOUSE_DB: bipros_analytics
      CLICKHOUSE_USER: bipros
      CLICKHOUSE_PASSWORD: bipros_dev
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9002:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/clickhouse-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Bipros backend (Spring Boot, Java 23). Multi-stage build defined in
  # backend/Dockerfile. Use SPRING_PROFILES_ACTIVE=prod for steady-state.
  # For the very first boot on an empty DB add ",init-prod" so DataSeeder
  # creates admin user + roles (Liquibase has no admin migration). The
  # narrower init-prod profile DOES NOT activate the bundled Khasab demo
  # seeders (those still gate on "seed" only) — keeps the DB empty for our
  # import scripts. Drop init-prod after the first boot.
  # ---------------------------------------------------------------------------
  bipros-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: bipros-api:prod
    container_name: bipros-api
    environment:
      SPRING_PROFILES_ACTIVE: ${BIPROS_PROFILES:-prod,init-prod}
      DATABASE_URL: jdbc:postgresql://postgresql:5432/bipros
      DB_USERNAME: bipros
      DB_PASSWORD: bipros_dev
      DB_POOL_MAX: "60"
      JWT_SECRET: ${JWT_SECRET:-change-me-32-byte-random-prod-secret-please-rotate}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      BIPROS_AI_ENABLED: ${BIPROS_AI_ENABLED:-true}
      # Default is the local dev KEK — fine for this Docker stack, but the
      # backend refuses to start in non-dev profiles without one set. ROTATE
      # before exposing this stack to anything that isn't your laptop.
      BIPROS_AI_KEK: ${BIPROS_AI_KEK:-Vd/RdHKwlLA1vFuDVUr/ou0CMHAsha99Cfi8UXzXUlA=}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # ---------------------------------------------------------------------
      # Schema build strategy
      # ---------------------------------------------------------------------
      # The committed Liquibase changelog has latent parse errors (it has been
      # disabled in dev — see SPRING_LIQUIBASE_ENABLED=false in application.yml
      # default profile — so it has never been exercised). Until the team
      # cleans up the YAML changesets, override the prod-profile defaults so
      # Hibernate builds the schema from @Entity classes (same as dev). This
      # gives us a working Docker stack today; for true prod (regulated
      # change-control, audit trail), fix the Liquibase changelog first.
      # See DEPLOY-DOCKER-PROD.md §"Known issue: Liquibase".
      SPRING_LIQUIBASE_ENABLED: "false"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      # In-container hostnames for sibling services. Defaults in application.yml
      # point at 127.0.0.1 which from inside a container is itself.
      CLICKHOUSE_URL: jdbc:clickhouse://clickhouse:8123/bipros_analytics
      CLICKHOUSE_USERNAME: bipros
      CLICKHOUSE_PASSWORD: bipros_dev
      SPRING_REDIS_HOST: redis
      SPRING_DATA_REDIS_HOST: redis
      JAVA_OPTS: "-Xmx2g -XX:MaxRAMPercentage=75"
    ports:
      - "8080:8080"
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  clickhouse_data:
