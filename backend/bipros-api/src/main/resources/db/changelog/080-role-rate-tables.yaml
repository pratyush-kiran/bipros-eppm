databaseChangeLog:
  - changeSet:
      id: 080-create-manpower-role-rates
      author: bipros
      changes:
        - createTable:
            tableName: manpower_role_rates
            schemaName: resource
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: role_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: category_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: grade_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: unit
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: rate
                  type: "numeric(19, 4)"
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: varchar(255)
              - column:
                  name: updated_by
                  type: varchar(255)
              - column:
                  name: version
                  type: bigint
                  defaultValueNumeric: 0

  - changeSet:
      id: 080-unique-manpower-role-rate
      author: bipros
      changes:
        - addUniqueConstraint:
            tableName: manpower_role_rates
            schemaName: resource
            columnNames: role_id, category_id, grade_id
            constraintName: uk_manpower_role_rate

  - changeSet:
      id: 080-index-mrr-role
      author: bipros
      changes:
        - createIndex:
            tableName: manpower_role_rates
            schemaName: resource
