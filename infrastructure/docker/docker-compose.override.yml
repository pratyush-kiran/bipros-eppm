# infrastructure/docker/docker-compose.override.yml
# Memory and JVM limits for the full-stack compose file.
# Applied automatically when using docker-compose.yml in this directory.
# Tuned for a medium-heavy Spring Boot monolith (21 modules, PostGIS, GIS).

services:

  backend:
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 384M
    environment:
      JAVA_OPTS: >-
        -Xms256m
        -Xmx512m
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -XX:+ExitOnOutOfMemoryError
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/tmp/bipros-heap.hprof
        -Djava.security.egd=file:/dev/./urandom

  frontend:
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  nginx:
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M

  clickhouse:
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  postgres:
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  redis:
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  minio:
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
