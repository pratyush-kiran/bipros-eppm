spring:
  application:
    name: bipros-data-bootstrap
  datasource:
    # Match the env vars + defaults used by bipros-api/application.yml
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/bipros}
    username: ${DB_USERNAME:bipros}
    password: ${DB_PASSWORD:bipros_dev}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # The main app owns schema evolution. We only insert/update data.
      ddl-auto: none
    properties:
      hibernate:
        default_schema: public
        jdbc:
          lob:
            non_contextual_creation: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  liquibase:
    enabled: false
  main:
    web-application-type: none
    banner-mode: off
    lazy-initialization: true

logging:
  level:
    root: INFO
    com.bipros.bootstrap: INFO
    org.hibernate.SQL: WARN
    org.springframework.boot.autoconfigure: WARN
