# Reverse proxy for the Bipros EPPM frontend served under /v2.
#
# The Next.js app is built with basePath=/v2 (NEXT_PUBLIC_BASE_PATH=/v2, see
# frontend/.env.production), so it OWNS the /v2 prefix — it serves both the
# /v2/ pages and the /v2/_next/* assets itself.
#
# CRITICAL: there is NO trailing slash on proxy_pass, so nginx forwards the
# request path unchanged (keeps /v2). A trailing slash (http://upstream/;)
# would STRIP /v2, and the app — which expects /v2 — would 404 every route
# and asset (the symptom: chunk 404s + "MIME type text/plain" CSS errors).

upstream bipros_frontend {
    # Point this at wherever `next start` listens:
    #   - Next on the Docker host:  server host.docker.internal:4001;  (needs extra_hosts, see compose)
    #   - Next as a compose service: server frontend:4001;
    server host.docker.internal:4001;
}

server {
    listen 80;
    server_name _;

    location /v2/ {
        proxy_pass http://bipros_frontend;          # no trailing slash — preserves /v2
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;     # Next HMR / websockets
        proxy_set_header Connection        "upgrade";
    }

    # bare /v2 (no trailing slash) → /v2/
    location = /v2 { return 301 /v2/; }
}
