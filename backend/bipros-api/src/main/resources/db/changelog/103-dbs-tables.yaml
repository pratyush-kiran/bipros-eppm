            tableName: dbs_daily_project
            schemaName: dbs

  - changeSet:
      id: 103-4-dbs-indexes
      author: bipros
      changes:
        - createIndex:
            tableName: dbs_daily_supervisor
            schemaName: dbs
            indexName: idx_dbs_sup_project_date_sup
            columns:
              - column:
                  name: project_id
              - column:
                  name: report_date
              - column:
                  name: supervisor_user_id
        - createIndex:
            tableName: dbs_daily_engineer
            schemaName: dbs
            indexName: idx_dbs_eng_project_date
            columns:
