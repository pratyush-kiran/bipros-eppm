                  type: "NUMERIC(19,2)"
                  defaultValueNumeric: 0
              - column:
                  name: contribution_pct
                  type: "NUMERIC(9,4)"
                  defaultValueNumeric: 0
              - column:
                  name: recomputed_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: VARCHAR(255)
              - column:
                  name: updated_by
                  type: VARCHAR(255)
              - column:
                  name: version
                  type: BIGINT
      rollback:
        - dropTable:
            tableName: dbs_daily_engineer
            schemaName: dbs

  - changeSet:
      id: 103-3-dbs-project
      author: bipros
      changes:
        - createTable:
            tableName: dbs_daily_project
            schemaName: dbs
            columns:
              - column:
                  name: id
