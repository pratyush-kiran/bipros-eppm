                  type: "NUMERIC(19,2)"
                  defaultValueNumeric: 0
              - column:
                  name: boq_planned_amount
                  type: "NUMERIC(19,2)"
                  defaultValueNumeric: 0
              - column:
                  name: boq_achieved_amount
                  type: "NUMERIC(19,2)"
                  defaultValueNumeric: 0
              - column:
