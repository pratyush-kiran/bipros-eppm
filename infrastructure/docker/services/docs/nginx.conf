server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Prevent nginx from generating absolute redirect URLs that lose the
    # non-standard port (4001) when adding trailing slashes
    absolute_redirect off;

    location = /docs { return 301 /docs/; }

    location /docs/ {
        try_files $uri $uri/ /docs/index.html;
    }

    # Cache static assets aggressively; Docusaurus adds content hashes to filenames
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
