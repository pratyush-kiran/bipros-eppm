spring:
  profiles:
    active: dev
  application:
    name: bipros-eppm

  sql:
    init:
      mode: never

  datasource:
    # Env-overrides make this file the single source of truth for local/dev; prod just sets
    # DATABASE_URL / DB_USERNAME / DB_PASSWORD in the orchestrator secrets.
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/bipros}
    username: ${DB_USERNAME:bipros}
    password: ${DB_PASSWORD:bipros_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    show-sql: false
    hibernate:
      # Dev default is `update` so test data (projects, norms, work-activities, daily outputs)
      # survives backend restarts — otherwise every restart re-issues all UUIDs and breaks any
      # bookmarks or in-flight test sessions.
      # Override with -Dspring.jpa.hibernate.ddl-auto=create-drop when you genuinely want a clean
      # slate, e.g. when iterating on seeder logic.
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        # Issue CREATE SCHEMA for schemas referenced via @Table(schema=...) when ddl-auto
        # is update/create/create-drop. Lets a first-time dev boot against an empty DB
        # without pre-running docker/init-schemas.sql.
        hbm2ddl:
          create_namespaces: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  liquibase:
    enabled: false  # Enable when migration files are ready
    change-log: classpath:db/changelog/db.changelog-master.yaml

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
    # Required for RoleAwareViewAdvice — when a @JsonView is active, fields without an explicit
    # view marker stay visible. Only fields explicitly annotated with @JsonView(FinanceConfidential)
    # etc. get filtered. Without this, every existing DTO would lose its unannotated fields.
    mapper:
      default-view-inclusion: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 1100MB
      max-request-size: 1100MB
      file-size-threshold: 10MB    # spool to disk above this

server:
  port: 8080
  servlet:
    context-path: /
  tomcat:
    # Tomcat silently drops large bodies past max-swallow-size (default 2MB).
    # Match the multipart limits so 1GB HDS PDF uploads aren't truncated.
    max-swallow-size: 1200MB
    max-http-form-post-size: 1200MB
    connection-timeout: 10m

# JWT Configuration — set JWT_SECRET in prod env to a 32+ byte random string.
bipros:
  security:
    jwt:
      secret: ${JWT_SECRET:bipros-dev-secret-key-must-be-at-least-256-bits-long-for-hmac-sha256}
      access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
      refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:86400000}
  cors:
    # Comma-separated list of allowed frontend origins. Override via CORS_ALLOWED_ORIGINS.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

  # Document binary storage — local filesystem; point at shared volume in prod or swap to S3
  document:
    storage:
      path: ./storage/documents
      max-file-size: 52428800   # 50 MB in bytes; must match spring.servlet.multipart.max-file-size

  # Contract attachment binary storage — same filesystem pattern as documents
  contract:
    storage:
      path: ./storage/contracts
      max-file-size: 52428800   # 50 MB in bytes; must match spring.servlet.multipart.max-file-size

  # DPR photo attachments — local-disk storage; per-DPR subdirectories (one folder per DPR id).
  # Images only (jpeg/png/webp/heic), 15 MB cap per file enforced in DprAttachmentStorageService.
  dpr:
    storage:
      path: ${BIPROS_DPR_STORAGE_PATH:./storage/dpr-photos}
      max-file-size: 15728640   # 15 MB
    # DPR voice notes — MinIO-backed (durable, multi-instance-safe). Audio only; 25 MB cap per
    # file enforced in DprVoiceNoteService. Bucket auto-created on boot.
    voice-notes:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:minio}
      secret-key: ${MINIO_SECRET_KEY:minio123}
      region: ${MINIO_REGION:us-east-1}
      bucket: ${DPR_VOICE_NOTES_BUCKET:dpr-voice-notes}
      multipart-part-size-mb: 5
      max-file-size: 26214400   # 25 MB

  # Error responses — include exception class + message + top stack frame in 500 bodies.
  # Default is OFF so production never leaks internals; default profile (dev) turns it ON below.
  errors:
    include-detail: true

  # Activity configuration
  activity:
    # Cron expression for the nightly DURATION percent-complete sweep.
    # Default: every day at 2:05 AM local time.
    duration-percent-cron: "0 5 2 * * *"

  # Seeder gates. The Excel master-data loader replaces the entire resource catalog
  # on every boot (it deletes resources/contracts/etc and re-inserts from
  # seed-data/ic-pms-sample.xlsx). Default OFF here so dev iterations don't lose
  # custom resources/rates/pool entries between restarts. Set to true when you
  # genuinely want the IC-PMS demo dataset (e.g. BIPROS_SEEDERS_EXCEL_MASTER_ENABLED=true).
  seeders:
    excel-master:
      enabled: ${BIPROS_SEEDERS_EXCEL_MASTER_ENABLED:false}

  # Disable the DBS aggregate backfill on every boot — for the fresh-environment
  # E2E run we explicitly recompute via /v1/projects/{pid}/dbs/recompute-range
  # after DPR import (faster + deterministic).
  dbs:
    # Section D (Fuel) in the Daily Balance Sheet is derived as this fraction of
    # Section C (Machinery) cost. 0.35 = 35%. Change here + restart (no UI, no recompile).
    fuel-machinery-cost-ratio: 0.35
    backfill:
      enabled: ${BIPROS_DBS_BACKFILL_ENABLED:false}

  # Disable the project-team backfill seeder. It iterates over project.projects
  # and tries to reattach the PM via ownerId; if we wipe projects mid-cycle it
  # tries to dereference stale FK. We populate project team explicitly via API.
  seeder:
    project-team:
      enabled: ${BIPROS_SEEDER_PROJECT_TEAM_ENABLED:false}

  # Disable the legacy-daily-output backfill so a clean DB doesn't trigger
  # migration of zero rows.
  backfill:
    legacy-daily-output:
      enabled: ${BIPROS_BACKFILL_LEGACY_DAILY_OUTPUT_ENABLED:false}

  # Satellite raster storage. MinIO in dev (docker-compose.yml), AWS S3 in prod
  # via the same config keys (change endpoint + credentials).
  storage:
    kind: s3
    s3:
      endpoint: http://localhost:9000
      access-key: minio
      secret-key: minio123
      region: us-east-1
      bucket: sentinel-tiles
    local:
      root: ./data/satellite

  # Satellite imagery providers. Dev defaults keep Sentinel Hub disabled so the
  # app boots without a Copernicus account. Set the three env vars and flip
  # enabled=true to activate ingestion.
  satellite:
    ingestion:
      enabled: false
      cron: "0 0 3 * * *"
      max-days-lookback: 7
    sentinel-hub:
      enabled: true
      # IMPORTANT: CDSE (Copernicus Data Space Ecosystem) and legacy Sentinel Hub
      # are independent services with independent credentials:
      #   CDSE    — free tier, signup at https://dataspace.copernicus.eu,
      #             API host: https://sh.dataspace.copernicus.eu,
      #             OAuth:    https://identity.dataspace.copernicus.eu/auth/realms/CDSE/protocol/openid-connect/token
      #   Legacy  — paid/trial, signup at https://www.sentinel-hub.com,
      #             API host: https://services.sentinel-hub.com,
      #             OAuth:    https://services.sentinel-hub.com/oauth/token
      # Pick the matching pair; pasting CDSE credentials at the legacy host
      # (or vice-versa) yields 401 "Please provide a valid access token" at
      # the catalog/process step even after OAuth succeeds.
      base-url: https://sh.dataspace.copernicus.eu
      token-url: https://identity.dataspace.copernicus.eu/auth/realms/CDSE/protocol/openid-connect/token
      client-id: ${SENTINEL_HUB_CLIENT_ID:}
      client-secret: ${SENTINEL_HUB_CLIENT_SECRET:}

  # AI progress analyzer — Anthropic Claude vision. Disabled by default so
  # manual ingestion runs don't silently spend tokens. Flip provider to
  # claude-vision and set ANTHROPIC_API_KEY to enable.
  ai:
    progress-analyzer:
      # Flip to "claude-vision" to enable the analyzer; requires ANTHROPIC_API_KEY.
      # Set to "none" to skip analysis (ingestion still fetches + stores imagery).
      provider: claude-vision
      anthropic-api-key: ${ANTHROPIC_API_KEY:}
      model: claude-sonnet-4-6
      max-tokens: 512
      request-timeout-seconds: 30

  # Analytics OLAP store (ClickHouse)
  analytics:
    clickhouse:
      url: ${CLICKHOUSE_URL:jdbc:clickhouse://127.0.0.1:8123/bipros_analytics}
      username: ${CLICKHOUSE_USER:bipros}
      password: ${CLICKHOUSE_PASSWORD:bipros_dev}
      pool:
        max-size: ${CLICKHOUSE_POOL_MAX:8}
        min-idle: 2
        connection-timeout: 30000
    sql-debug: ${ANALYTICS_SQL_DEBUG:false}

  # AI orchestration and chat
  ai-orchestrator:
    enabled: ${BIPROS_AI_ENABLED:false}
    kek: ${BIPROS_AI_KEK:}
    # Per-module ReAct loop caps. `general` is the global / portfolio mode that
    # typically needs an extra round (list_projects → query → drill in → answer);
    # `default` covers project-scoped chats (cost / schedule / risk / dpr / evm).
    # The verification pass consumes one round on top of any tool-calling rounds,
    # so effective "real reasoning" budget = cap - 1. Cross-entity questions
    # (issues per activity, walk-from-X) regularly need 6+ rounds when the model
    # discovers + corrects + verifies, so the project cap is set generously.
    max-tool-rounds:
      general: 12
      default: 10
    conversation:
      max-messages: 32
      max-input-tokens: 200000
      ttl-days: 90

  # HDS — Highway Design Standards knowledge base (PDF ingestion + vector retrieval).
  # reranker.enabled defaults false so Phase 2 ships without the BGE cross-encoder
  # service; retrieval falls back to RRF over BM25 + vector. Flip on after Phase 5.
  hds:
    storage:
      bucket: hds
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:minio}
      secret-key: ${MINIO_SECRET_KEY:minio123}
      region: ${MINIO_REGION:us-east-1}
      multipart-part-size-mb: 5
    docling:
      url: ${DOCLING_URL:http://localhost:5001}
      timeout-minutes: 60
    # PDF parser routing. PDFBox handles text-extractable PDFs (the common HDS case)
    # with ~200 MB peak memory regardless of file size. Docling stays as the fallback
    # for image/scanned PDFs that need layout + OCR analysis.
    parser:
      text-mode-enabled: ${HDS_PARSER_TEXT_MODE:true}
      min-chars-per-page: 200
      probe-sample-size: 5
      # Any PDF this size or larger goes through PDFBox regardless of probe outcome.
      # Set 0 to disable. Tuned for a 10-12 GiB Docker VM where Docling OOMs above
      # ~150 MB inputs.
      force-pdfbox-over-mb: 100
    embedding:
      model: text-embedding-3-large
      dimensions: 1536
      batch-size: 100
      concurrency: 4
    reranker:
      enabled: ${HDS_RERANKER_ENABLED:false}
      url: ${HDS_RERANKER_URL:http://localhost:8088}
      top-k: 10
    retrieval:
      similarity-floor: 0.30
      bm25-top-k: 50
      vector-top-k: 50
      max-chunks-per-query: 20
      max-rounds: 2
      cache-ttl-seconds: 3600
    verifier:
      max-retries: 1
    ingestion:
      worker-poll-seconds: 5
      heartbeat-interval-seconds: 10
      stale-job-after-seconds: 60

# OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Logging
logging:
  level:
    com.bipros: DEBUG
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: INFO
    org.springframework.security: DEBUG

# Disable legacy project seeders (OmanRoadProjectSeeder / KhasabDailyDataSeeder)
# that would re-create projects 6155 / SC-180 deleted from this dev DB. Override
# with -Dseeders.legacy.enabled=true to re-enable for a fresh seed.
seeders:
  legacy:
    enabled: false

# Skip AnalyticsBackfillBootstrap on every boot. The bootstrap re-runs heavy
# backfills for any fact table that's empty (cost/evm/risk/labour) — for the
# OMAN-only DB there's no source data in those tables, so the iteration is wasted
# CPU and currently pegs ClickHouse during merges. Trigger backfills manually via
# /v1/admin/analytics/backfill when needed. Set true to re-enable on-boot backfill.
analytics:
  bootstrap:
    enabled: false

---
# Production profile — activate with SPRING_PROFILES_ACTIVE=prod.
# Required env vars in prod:
#   DATABASE_URL / DB_USERNAME / DB_PASSWORD
#   JWT_SECRET            — 32+ byte random string (never reuse the dev default)
#   CORS_ALLOWED_ORIGINS  — comma-separated list of frontend origins
# Optional: ANTHROPIC_API_KEY, SENTINEL_HUB_CLIENT_ID, SENTINEL_HUB_CLIENT_SECRET.
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  liquibase:
    enabled: true

bipros:
  errors:
    include-detail: false  # hide stack traces from clients in prod

logging:
  level:
    com.bipros: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN
